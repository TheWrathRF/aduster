name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit (the tag in the comment); Rust by core/rust-toolchain.toml, which
# `rustup toolchain install` reads, components and Android target included.
jobs:
  rust:
    name: Rust tests and clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Kotlin tests, lint and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;30.0.16248370"
      - run: rustup toolchain install --no-self-update
        working-directory: core
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      # The release's prebuilt binary instead of a build from source.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-ndk@4.1.2
      # setup-gradle also checks that gradle-wrapper.jar is an official Gradle release.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # cargo-ndk does not pass `-- -D warnings` on, so any warning line fails the step instead.
      # The runner's own ANDROID_NDK_ROOT names another NDK, which cargo-ndk warns about: both
      # variables name the one the app builds with.
      - name: Clippy for Android
        working-directory: core
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/30.0.16248370"
          cargo ndk -t arm64-v8a -P 33 clippy -p aduster-ffi --release 2>&1 | tee clippy.txt
          ! grep -q '^warning' clippy.txt
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
