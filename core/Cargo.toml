[workspace]
resolver = "3"
members = ["crates/matcher", "crates/dnsengine", "crates/proxy", "crates/ffi"]

[workspace.package]
edition = "2024"
version = "0.1.0"
# All rights reserved: the source is published to read, not under an open-source licence.
license-file = "../LICENSE"
publish = false

[workspace.dependencies]
matcher = { path = "crates/matcher" }
dnsengine = { path = "crates/dnsengine" }
proxy = { path = "crates/proxy" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "perf", "meta", "nfa", "dfa", "hybrid"] }
memmap2 = "0.9"
arc-swap = "1.7"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Release builds keep warnings and errors only: the info, debug and trace calls and their
# strings are compiled out (`tracing` for h2).
log = { version = "0.4", features = ["release_max_level_warn"] }
tracing = { version = "0.1", default-features = false, features = ["release_max_level_warn"] }
libc = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
socket2 = "0.6"
# 0.18.2+: RUSTSEC-2026-0253 (pop() was not panic-safe).
lru = "0.18.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = false

[profile.dev]
opt-level = 1
